# The Spark versions published in Apache Iceberg's gradle/libs.versions.toml are
# treated as the minimum supported patch for each Spark minor release. Every
# cudf-spark shim at or above that minimum is recorded below. Combinations that
# Iceberg supports but cudf-spark does not currently package stay in the matrix
# with an explanation so future support gaps are visible.
iceberg_versions:
  - version: "1.6.1"
    upstream_minimums:
      "3.3": "3.3.4"
      "3.4": "3.4.3"
      "3.5": "3.5.1"
    spark_versions:
      - version: "3.3.4"
        supported: false
        reason: "Iceberg GPU acceleration is not currently packaged for Spark 3.3.x"
      - version: "3.4.3"
        supported: false
        reason: "Iceberg GPU acceleration is not currently packaged for Spark 3.4.x"
      - version: "3.4.4"
        supported: false
        reason: "Iceberg GPU acceleration is not currently packaged for Spark 3.4.x"
      - version: "3.5.1"
        supported: true
      - version: "3.5.2"
        supported: true
      - version: "3.5.3"
        supported: true
      - version: "3.5.4"
        supported: false
        reason: "The Iceberg 1.6.x integration module is not packaged for Spark 3.5.4 and later"
      - version: "3.5.5"
        supported: false
        reason: "The Iceberg 1.6.x integration module is not packaged for Spark 3.5.4 and later"
      - version: "3.5.6"
        supported: false
        reason: "The Iceberg 1.6.x integration module is not packaged for Spark 3.5.4 and later"
      - version: "3.5.7"
        supported: false
        reason: "The Iceberg 1.6.x integration module is not packaged for Spark 3.5.4 and later"
      - version: "3.5.8"
        supported: false
        reason: "The Iceberg 1.6.x integration module is not packaged for Spark 3.5.4 and later"
      - version: "3.5.9"
        supported: false
        reason: "The Iceberg 1.6.x integration module is not packaged for Spark 3.5.4 and later"

  - version: "1.9.2"
    upstream_minimums:
      "3.4": "3.4.4"
      "3.5": "3.5.5"
    spark_versions:
      - version: "3.4.4"
        supported: false
        reason: "Iceberg GPU acceleration is not currently packaged for Spark 3.4.x"
      - version: "3.5.5"
        supported: true
      - version: "3.5.6"
        supported: true
      - version: "3.5.7"
        supported: true
      - version: "3.5.8"
        supported: true
      - version: "3.5.9"
        supported: true

  - version: "1.10.1"
    upstream_minimums:
      "3.4": "3.4.4"
      "3.5": "3.5.6"
      "4.0": "4.0.0"
    spark_versions:
      - version: "3.4.4"
        supported: false
        reason: "Iceberg GPU acceleration is not currently packaged for Spark 3.4.x"
      - version: "3.5.6"
        supported: true
      - version: "3.5.7"
        supported: true
      - version: "3.5.8"
        supported: true
      - version: "3.5.9"
        supported: true
      - version: "4.0.0"
        supported: true
      - version: "4.0.1"
        supported: true
      - version: "4.0.2"
        supported: true
      - version: "4.0.3"
        supported: true
      - version: "4.0.4"
        supported: true

  - version: "1.11.0"
    upstream_minimums:
      "3.4": "3.4.4"
      "3.5": "3.5.8"
      "4.0": "4.0.2"
      "4.1": "4.1.1"
    spark_versions:
      - version: "3.4.4"
        supported: false
        reason: "Iceberg GPU acceleration is not currently packaged for Spark 3.4.x"
      - version: "3.5.8"
        supported: false
        reason: "The Iceberg 1.11.x integration module is not currently packaged for Spark 3.5.x"
      - version: "3.5.9"
        supported: false
        reason: "The Iceberg 1.11.x integration module is not currently packaged for Spark 3.5.x"
      - version: "4.0.2"
        supported: true
      - version: "4.0.3"
        supported: true
      - version: "4.0.4"
        supported: true
      - version: "4.1.1"
        supported: true
      - version: "4.1.2"
        supported: true
      - version: "4.1.3"
        supported: true
