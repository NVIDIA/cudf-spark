name: GPU CI Databricks
on:
  workflow_run:
    workflows: ['GPU CI']
    types: [in_progress, completed]
    branches: ['pull-request/[0-9]+']

permissions: {}

env:
  DB_RUNNER_GROUP: ${{ vars.DATABRICKS_CI_RUNNER_GROUP }}
  DB_ENABLED: ${{ vars.DATABRICKS_CI_ENABLED }}

jobs:
  pending:
    if: >-
      github.repository == 'NVIDIA/cudf-spark' && github.event.workflow_run.actor.login == 'copy-pr-bot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: &status-lock
      group: db-result-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    permissions: {contents: read, actions: read, pull-requests: read, statuses: write}
    steps:
      - uses: &checkout actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - run: python3 -I .github/workflows/databricks-ci/source.py --status pending
        env: {GH_TOKEN: '${{ github.token }}'}

  select:
    needs: pending
    if: >-
      github.repository == 'NVIDIA/cudf-spark' &&
      github.event.action == 'completed' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'copy-pr-bot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: read, actions: read, pull-requests: read}
    outputs:
      base: ${{ steps.plan.outputs.base }}
      head: ${{ steps.plan.outputs.head }}
      merge: ${{ steps.plan.outputs.merge }}
      run: ${{ steps.plan.outputs.run }}
      reduced: ${{ steps.plan.outputs.reduced_it }}
      policy: ${{ steps.plan.outputs.policy }}
    steps:
      - uses: *checkout
        with: {ref: '${{ github.sha }}', path: control, persist-credentials: false}
      - id: source
        run: python3 -I control/.github/workflows/databricks-ci/source.py
        env: {GH_TOKEN: '${{ github.token }}'}
      - uses: *checkout
        with:
          ref: ${{ steps.source.outputs.merge }}
          path: candidate
          fetch-depth: 2
          persist-credentials: false
      - id: plan
        run: python3 -I control/.github/workflows/databricks-ci/source.py --candidate candidate
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MERGE: ${{ steps.source.outputs.merge }}

  databricks:
    name: DBR ${{ matrix.runtime }} / ${{ matrix.mode }}
    needs: select
    if: needs.select.outputs.run == 'true'
    runs-on:
      group: ${{ vars.DATABRICKS_CI_RUNNER_GROUP }}
    environment: databricks-ci
    concurrency:
      group: db-cell-${{ github.event.workflow_run.head_branch }}-${{ matrix.runtime }}-${{ matrix.mode }}
      cancel-in-progress: false
    # Observed cells reached 214 minutes; allow startup retries and a separate cleanup window.
    timeout-minutes: 380
    permissions: {contents: read, actions: read, pull-requests: read}
    strategy:
      fail-fast: true
      matrix:
        runtime: ['17.3', '18.3']
        mode: [CI_PART1, CI_PART2]
    env:
      DB_RUNTIME: ${{ matrix.runtime }}
      DB_MODE: ${{ matrix.mode }}
      EXPECTED_BASE: ${{ needs.select.outputs.base }}
      EXPECTED_HEAD: ${{ needs.select.outputs.head }}
      EXPECTED_MERGE: ${{ needs.select.outputs.merge }}
      EXPECTED_POLICY: ${{ needs.select.outputs.policy }}
      EXPECTED_REDUCED: ${{ needs.select.outputs.reduced }}
    steps:
      - uses: *checkout
        with: {ref: '${{ github.sha }}', path: control, persist-credentials: false}
      - uses: *checkout
        with: {ref: '${{ needs.select.outputs.merge }}', path: candidate, fetch-depth: 2, persist-credentials: false}
      - name: Verify approval and prepare pinned source
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 -I control/.github/workflows/databricks-ci/source.py --candidate candidate
          python3 -I control/.github/workflows/databricks-ci/prior-cleanup.py --runtime "$DB_RUNTIME" --mode "$DB_MODE"
          python3 -I -c 'import requests'
          bash control/.github/workflows/databricks-ci/submodules.sh candidate
      - name: Restore the upstream smoke-test Spark binary
        id: spark
        if: matrix.mode == 'CI_PART1'
        timeout-minutes: 10
        continue-on-error: true
        uses: ./control/.github/actions/spark-archive-cache
        with: {scala: '2.13', distribution: databricks-smoke}
      - name: Build and test the approved merge on Databricks
        id: attempts
        timeout-minutes: 330
        env: &db-credentials
          DATABRICKS_PROFILES_JSON: ${{ vars.DATABRICKS_PROFILES_JSON }}
          DATABRICKS_AWS2_TOKEN: ${{ secrets.DATABRICKS_AWS2_TOKEN }}
          DATABRICKS_AWS_TOKEN: ${{ secrets.DATABRICKS_AWS_TOKEN }}
          DATABRICKS_AZURE3_TOKEN: ${{ secrets.DATABRICKS_AZURE3_TOKEN }}
          DATABRICKS_JUMP_PRIVATE_KEY: ${{ secrets.DATABRICKS_JUMP_PRIVATE_KEY }}
          DATABRICKS_JUMP_KNOWN_HOSTS: ${{ secrets.DATABRICKS_JUMP_KNOWN_HOSTS }}
          SPARK_CACHE_FILE: ${{ steps.spark.outputs.path }}
        run: |
          args=()
          if [[ $EXPECTED_REDUCED == true ]]; then args+=(--reduced); fi
          python3 -I control/.github/workflows/databricks-ci/attempts.py run \
            --runtime "$DB_RUNTIME" --mode "$DB_MODE" --candidate candidate --merge-sha "$EXPECTED_MERGE" \
            --state-dir "$RUNNER_TEMP/db-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$DB_RUNTIME-$DB_MODE" "${args[@]}"
      - name: Confirm cluster cleanup
        if: always() && steps.attempts.outcome != 'skipped' && steps.attempts.outcome != ''
        timeout-minutes: 15
        env: *db-credentials
        run: |
          python3 -I control/.github/workflows/databricks-ci/attempts.py cleanup \
            --runtime "$DB_RUNTIME" --mode "$DB_MODE" \
            --state-dir "$RUNNER_TEMP/db-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$DB_RUNTIME-$DB_MODE"

  result:
    if: >-
      always() && github.repository == 'NVIDIA/cudf-spark' &&
      github.event.action == 'completed' && github.event.workflow_run.actor.login == 'copy-pr-bot[bot]'
    needs: [select, databricks]
    concurrency: *status-lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: read, actions: read, pull-requests: read, statuses: write}
    steps:
      - uses: *checkout
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - name: Report the combined GPU CI gate on the tested PR merge
        run: python3 -I .github/workflows/databricks-ci/source.py --status result
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RESULT: ${{ needs.select.result }}
          DB_RESULT: ${{ needs.databricks.result }}
          DB_SELECTED: ${{ needs.select.outputs.run }}
          EXPECTED_BASE: ${{ needs.select.outputs.base }}
          EXPECTED_HEAD: ${{ needs.select.outputs.head }}
          EXPECTED_MERGE: ${{ needs.select.outputs.merge }}
          EXPECTED_POLICY: ${{ needs.select.outputs.policy }}
