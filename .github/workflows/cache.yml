# Seed the Maven Verify and Spark premerge dependencies on the target branch.
name: Cache preparation

on:
  push:
    branches: [main, 'release/[0-9][0-9].[0-9][0-9]']
    paths:
      - '**/pom.xml'
      - 'build/get_buildvers.py'
      - 'integration_tests/run_unity_catalog_server.sh'
      - '.github/workflows/mvn-verify-check/*.sh'
      - '.github/workflows/mvn-verify-check/dependency-key.py'
      - '.github/workflows/mvn-verify-check/action.yml'
      - '.github/workflows/mvn-verify-check.yml'
      - '.github/workflows/cache.yml'
      - '.github/workflows/premerge-spark-cache/**'
  schedule:
    # JNI and private SNAPSHOTs can advance without a change in this repository.
    - cron: '43 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-preparation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Scala ${{ matrix.scala }} caches
    if: >-
      github.repository == 'NVIDIA/cudf-spark' && !github.event.deleted &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        scala: ['2.12', '2.13']
    steps:
      - name: Check manual refresh target
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ ! $GITHUB_REF_NAME =~ ^(main|release/[0-9]{2}\.[0-9]{2})$ ]]; then
            echo "::error::Select main or a release/YY.MM branch for cache warming."
            exit 1
          fi
      - uses: NVIDIA/spark-rapids-common/checkout@main
        id: checkout
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: ./.github/workflows/mvn-verify-check
        with:
          scala: ${{ matrix.scala }}
          premerge: 'true'
      - name: Warm Apache Spark distribution
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: ./.github/workflows/premerge-spark-cache
        with:
          scala: ${{ matrix.scala }}
          save: 'true'
