verbose = "error"
no_progress = true
timeout = 15
max_retries = 3
retry_wait_time = 5
accept = [200, 403, 429]
hidden = true

exclude = [
  '^https://github\.com/NVIDIA/(spark-rapids|cudf-spark)/(pull|issues)/',
  '(^|/)docs/archives',
  '^http://localhost',
  '^https://www\.nvidia\.com/en-us/security/pgp-key',
  '^https://repo1\.maven\.org/maven2/com/nvidia/rapids-4-spark_2\.',
  '^https://deepwiki\.com/',
]

# Historical changelogs account for most repository links and are immutable.
exclude_path = ['(^|/)(CHANGELOG\.md|docs/archive\.md|docs/archives/)']
