# Run the CPU checks selected for each pull request and report their combined result.
name: CPU CI

on:
  pull_request:
    branches: [main, 'release/[0-9][0-9].[0-9][0-9]']
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  # Reject stale manual reruns in select without cancelling a newer automatic run.
  group: cpu-ci-pr-${{ github.event.pull_request.number }}-${{ github.run_attempt > 1 && github.run_id || 'auto' }}
  cancel-in-progress: true

jobs:
  select:
    name: Select CPU checks
    runs-on: ubuntu-latest
    outputs:
      validate: ${{ steps.title.outputs.skip == 'true' && '[]' || steps.recipes.outputs.validate }}
      maven: ${{ steps.maven.outputs.mode }}
      required: ${{ steps.required.outputs.jobs }}
    steps:
      - name: Read the current PR title
        id: title
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # A manual rerun reuses the original event payload, including its old title.
          if [[ $GITHUB_RUN_ATTEMPT == 1 ]]; then
            pr=$(jq -c '.pull_request' "$GITHUB_EVENT_PATH")
          else
            pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          fi
          skip=$(jq -er --arg head "$HEAD_SHA" --arg base "$BASE_REF" '
            if .state == "open" and .head.sha == $head and .base.ref == $base
            then .title | ascii_downcase | contains("[skip ci]") | tostring
            else error("PR is closed or its head or base has changed")
            end' <<< "$pr")
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [[ $skip == true ]]; then
            echo 'Docker validation skipped by PR title.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: NVIDIA/spark-rapids-common/checkout@main
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Select hosted Maven checks
        id: maven
        shell: bash
        run: |
          mode=$(python3 .github/workflows/mvn-verify-impact.py)
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Hosted Maven checks: $mode" >> "$GITHUB_STEP_SUMMARY"
      - name: Check licenses for standalone pytest edits
        if: steps.maven.outputs.mode == 'rat'
        run: mvn --batch-mode -s .github/actions/maven-cache/settings.xml -N -f integration_tests/pom.xml apache-rat:check
      - name: Select image recipes
        id: recipes
        if: steps.title.outputs.skip == 'false'
        run: python3 .github/workflows/ci-images/select.py
      - name: Test image CI
        if: steps.recipes.outputs.run-tests == 'true'
        run: python3 -m unittest discover -s .github/workflows/ci-images/tests -v
      - name: Set required jobs
        id: required
        shell: bash
        env:
          VALIDATE: ${{ steps.title.outputs.skip == 'true' && '[]' || steps.recipes.outputs.validate }}
          MAVEN: ${{ steps.maven.outputs.mode }}
        run: |
          jobs=$(jq -cne --argjson images "$VALIDATE" --arg maven "$MAVEN" '
            if ($images | type) != "array" or (["full","rat","skip"] | index($maven)) == null
            then error("Invalid CPU selection")
            else ["select", (if ($images | length) > 0 then "validate" else empty end),
                 (if $maven == "full" then "maven" else empty end)] end')
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"

  maven:
    name: Maven Verify
    needs: select
    if: needs.select.outputs.maven == 'full'
    uses: ./.github/workflows/mvn-verify-check.yml

  validate:
    name: Validate ${{ matrix.image.id }}
    needs: select
    if: needs.select.outputs.validate != '' && needs.select.outputs.validate != '[]'
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.select.outputs.validate) }}
    uses: ./.github/workflows/build-docker-image.yml
    with:
      config: ${{ toJSON(matrix.image) }}

  result:
    name: CPU CI gate
    if: always()
    needs: [select, validate, maven]
    runs-on: ubuntu-latest
    steps:
      - uses: NVIDIA/spark-rapids-common/workflow-result-gate@main
        with:
          needs: ${{ toJSON(needs) }}
          required-jobs: ${{ needs.select.outputs.required || '["select","validate","maven"]' }}

  # Remove after main and release branch rules require CPU CI gate instead.
  legacy-maven-check:
    name: ${{ matrix.context }}
    needs: [select, maven]
    if: always()
    runs-on: ubuntu-slim
    strategy:
      fail-fast: false
      matrix:
        context:
          - package-tests (340, false)
          - package-tests (356, false)
          - package-tests-scala213 (400, false)
          - verify-213-modules (400, 17)
        include: >-
          ${{ fromJSON(github.base_ref == 'main' &&
          '[{"context":"package-tests (333, false)"},{"context":"package-tests-scala213 (350, false)"},{"context":"package-tests-scala213 (356, false)"}]'
          || '[]') }}
    steps:
      - name: Check the selected Maven result
        shell: bash
        env:
          SELECT: ${{ needs.select.result }}
          MAVEN: ${{ needs.maven.result }}
          MODE: ${{ needs.select.outputs.maven }}
          CONTEXT: ${{ matrix.context }}
          VERIFIED: ${{ needs.maven.outputs.contexts }}
        run: |
          case "$SELECT:$MODE:$MAVEN" in
            success:full:success)
              jq -en --arg context "$CONTEXT" --argjson verified "$VERIFIED" '$verified | index($context) != null' ;;
            success:rat:skipped|success:skip:skipped) echo "Full Maven Verify not selected ($MODE)." ;;
            *) echo "::error::Maven check $CONTEXT: selector=$SELECT mode=$MODE workload=$MAVEN"; exit 1 ;;
          esac
