# Run the selected CPU checks after the copy bot approves a PR revision.
name: CPU CI

on:
  push:
    branches: ['pull-request/[0-9]+']

permissions:
  contents: read

concurrency:
  # Reject stale manual reruns in select without cancelling a newer automatic run.
  group: cpu-ci-${{ github.ref }}-${{ github.run_attempt > 1 && github.run_id || 'auto' }}
  cancel-in-progress: true

jobs:
  select:
    name: Select CPU checks
    # Selection may run a cold Maven RAT check and the affected CI helper tests.
    timeout-minutes: 20
    if: github.repository == 'NVIDIA/cudf-spark' && !github.event.deleted
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base: ${{ steps.pr.outputs.base-branch }}
      merge: ${{ steps.pr.outputs.merge-sha }}
      cpu-scope: ${{ steps.pr.outputs.cpu-scope }}
      validate: ${{ steps.recipes.outputs.validate }}
      maven: ${{ steps.maven.outputs.mode }}
      required: ${{ steps.required.outputs.jobs }}
    steps:
      - name: Resolve the approved PR merge
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const number = /^refs\/heads\/pull-request\/([1-9]\d*)$/.exec(context.ref)?.[1];
            if (!number) throw new Error('Expected a copied PR branch');
            const {data: copy} = await github.rest.git.getRef({...context.repo, ref: context.ref.slice(5)});
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: Number(number)});
            if (copy.object.sha !== context.sha || pr.state !== 'open' || pr.head.sha !== context.sha ||
                !pr.base.ref || !pr.merge_commit_sha || pr.mergeable === false) throw new Error('No current testable PR for this copy');
            const {data: merge} = await github.rest.git.getCommit({...context.repo, commit_sha: pr.merge_commit_sha});
            if (merge.sha !== pr.merge_commit_sha ||
                merge.parents.map(p => p.sha).join(' ') !== `${pr.base.sha} ${context.sha}`) throw new Error('Stale test merge');
            core.setOutput('base-branch', pr.base.ref);
            core.setOutput('merge-sha', pr.merge_commit_sha);
            core.setOutput('skip-ci', /\[skip ci\]/i.test(pr.title));
            core.setOutput('cpu-scope', pr.base.ref === 'main' || /^release\/\d{2}\.\d{2}$/.test(pr.base.ref));
      - uses: NVIDIA/spark-rapids-common/checkout@main
        if: steps.pr.outputs.cpu-scope == 'true'
        with:
          ref: ${{ steps.pr.outputs.merge-sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Select hosted Maven checks
        if: steps.pr.outputs.cpu-scope == 'true'
        id: maven
        shell: bash
        run: |
          mode=$(python3 .github/workflows/mvn-verify-impact.py)
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Hosted Maven checks: $mode" >> "$GITHUB_STEP_SUMMARY"
      - name: Check licenses for standalone pytest edits
        if: steps.maven.outputs.mode == 'rat'
        run: mvn --batch-mode -s .github/actions/maven-cache/settings.xml -N -f integration_tests/pom.xml apache-rat:check
      - name: Test Databricks CI helpers when changed
        if: steps.pr.outputs.cpu-scope == 'true'
        run: bash .github/workflows/cpu-ci.sh db-tests
      - name: Select image recipes
        id: recipes
        if: steps.pr.outputs.cpu-scope == 'true' && steps.pr.outputs.skip-ci == 'false'
        env:
          BASE: ${{ steps.pr.outputs.base-branch }}
        run: python3 .github/workflows/ci-images/select.py --pr-base "$BASE"
      - name: Test image CI
        if: steps.recipes.outputs.run-tests == 'true'
        run: python3 -m unittest discover -s .github/workflows/ci-images/tests -v
      - name: Set required jobs
        if: steps.pr.outputs.cpu-scope == 'true'
        id: required
        shell: bash
        env:
          VALIDATE: ${{ steps.pr.outputs.skip-ci == 'true' && '[]' || steps.recipes.outputs.validate }}
          MAVEN: ${{ steps.maven.outputs.mode }}
        run: bash .github/workflows/cpu-ci.sh required

  maven:
    name: Maven Verify
    needs: select
    # Other PR bases retain their existing full Maven Verify, but only after approval.
    if: needs.select.outputs.maven == 'full' || needs.select.outputs.cpu-scope == 'false'
    uses: ./.github/workflows/mvn-verify-check.yml
    with:
      merge-sha: ${{ needs.select.outputs.merge }}
      base-branch: ${{ needs.select.outputs.base }}

  validate:
    name: Validate ${{ matrix.image.id }}
    needs: select
    if: needs.select.outputs.validate != '' && needs.select.outputs.validate != '[]'
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.select.outputs.validate) }}
    uses: ./.github/workflows/build-docker-image.yml
    with:
      config: ${{ toJSON(matrix.image) }}
      merge-sha: ${{ needs.select.outputs.merge }}

  result:
    name: CPU CI gate
    timeout-minutes: 5
    if: always() && needs.select.result != 'skipped' && needs.select.outputs.cpu-scope != 'false'
    needs: [select, validate, maven]
    runs-on: ubuntu-latest
    steps:
      - uses: NVIDIA/spark-rapids-common/workflow-result-gate@main
        with:
          needs: ${{ toJSON(needs) }}
          required-jobs: ${{ needs.select.outputs.required || '["select","validate","maven"]' }}

  # Remove after main and release branch rules require CPU CI gate instead.
  legacy-maven-check:
    name: ${{ matrix.context }}
    timeout-minutes: 5
    needs: [select, maven]
    if: always() && needs.select.result != 'skipped' && needs.select.outputs.cpu-scope != 'false'
    runs-on: ubuntu-slim
    strategy:
      fail-fast: false
      matrix:
        context:
          - package-tests (340, false)
          - package-tests (356, false)
          - package-tests-scala213 (400, false)
          - verify-213-modules (400, 17)
        include: >-
          ${{ fromJSON(needs.select.outputs.base == 'main' &&
          '[{"context":"package-tests (333, false)"},{"context":"package-tests-scala213 (350, false)"},{"context":"package-tests-scala213 (356, false)"}]'
          || '[]') }}
    steps:
      - name: Check the selected Maven result
        shell: bash
        env:
          SELECT: ${{ needs.select.result }}
          MAVEN: ${{ needs.maven.result }}
          MODE: ${{ needs.select.outputs.maven }}
          CONTEXT: ${{ matrix.context }}
          VERIFIED: ${{ needs.maven.outputs.contexts }}
        run: |
          case "$SELECT:$MODE:$MAVEN" in
            success:full:success)
              jq -en --arg context "$CONTEXT" --argjson verified "$VERIFIED" \
                '$verified | type == "array" and index($context) != null' ;;
            success:rat:skipped|success:skip:skipped) echo "Full Maven Verify not selected ($MODE)." ;;
            *) echo "::error::Maven check $CONTEXT: selector=$SELECT mode=$MODE workload=$MAVEN"; exit 1 ;;
          esac
