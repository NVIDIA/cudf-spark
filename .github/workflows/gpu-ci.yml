name: GPU CI
on:
  push:
    branches: ['pull-request/[0-9]+']

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: gpu-ci-${{ github.ref }}-${{ github.run_attempt > 1 && github.run_id || 'auto' }}
  cancel-in-progress: true

jobs:
  select:
    if: github.repository == 'NVIDIA/cudf-spark' && !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base-branch: ${{ steps.pr.outputs.base-branch }}
      base-sha: ${{ steps.pr.outputs.base-sha }}
      merge-sha: ${{ steps.pr.outputs.merge-sha }}
      title-policy: ${{ steps.pr.outputs.title-policy }}
      parallel-ut: ${{ steps.pr.outputs.parallel-ut }}
      reduced-it: ${{ steps.pr.outputs.reduced-it }}
      matrix: ${{ steps.groups.outputs.matrix }}
      selection-attempt: ${{ steps.pr.outputs.attempt }}
      cache212: ${{ steps.groups.outputs.cache212 }}
      cache213: ${{ steps.groups.outputs.cache213 }}
      required-jobs: ${{ steps.groups.outputs.matrix && '["select","gpu-test"]' || '["select"]' }}
    steps:
      - name: Identify the approved PR and merge candidate
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const copy = /^refs\/heads\/pull-request\/([1-9]\d*)$/.exec(context.ref);
            if (!copy) throw new Error('Expected a copied PR branch');
            core.setOutput('attempt', process.env.GITHUB_RUN_ATTEMPT);
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: Number(copy[1])});
            if (pr.state !== 'open' || pr.head.sha !== context.sha || !pr.merge_commit_sha || pr.mergeable === false)
              throw new Error('Copied head no longer matches a testable open PR');
            const flags = [/\[skip ci\]/i, /\[databricks\]/i, /\[reduced-it\]/i, /\[serial[ -]ut\]/i].map(re => re.test(pr.title));
            for (const [key, value] of Object.entries({'base-branch': pr.base.ref, 'base-sha': pr.base.sha,
              'merge-sha': pr.merge_commit_sha, 'skip-ci': flags[0], 'parallel-ut': !flags[3],
              'reduced-it': flags[2], 'title-policy': flags.map(Number).join('')})) core.setOutput(key, value);
      - id: eligible
        env:
          BASE: ${{ steps.pr.outputs.base-branch }}
          SKIP: ${{ steps.pr.outputs.skip-ci }}
        run: |
          if [[ $SKIP != true && ( $BASE == main || ( $BASE =~ ^release/[0-9]{2}\.[0-9]{2}$ && ! $BASE < release/27.02 ) ) ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: NVIDIA/spark-rapids-common/checkout@main
        if: steps.eligible.outputs.run == 'true'
        with:
          ref: ${{ steps.pr.outputs.merge-sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Check both merge parents
        if: steps.eligible.outputs.run == 'true'
        env:
          BASE_SHA: ${{ steps.pr.outputs.base-sha }}
        run: test "$(git show -s --format=%P HEAD)" = "$BASE_SHA $GITHUB_SHA"
      - id: suites
        if: steps.eligible.outputs.run == 'true'
        continue-on-error: true
        uses: NVIDIA/spark-rapids-common/workflow-suite-selector@main
        with:
          catalog-path: .github/gpu-ci-suites.json
          base-branch: ${{ steps.pr.outputs.base-branch }}
          selector-job: select
      - name: Select GPU runner assignments
        id: groups
        if: steps.eligible.outputs.run == 'true'
        env:
          SELECT_OUTCOME: ${{ steps.suites.outcome }}
          SUITES: ${{ steps.suites.outputs.suites }}
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.pr.outputs.base-branch }}
          BASE_SHA: ${{ steps.pr.outputs.base-sha }}
          MERGE_SHA: ${{ steps.pr.outputs.merge-sha }}
        run: bash .github/workflows/gpu-ci/select-groups.sh

  cache-212:
    needs: select
    if: needs.select.outputs.cache212 != '' && needs.select.outputs.cache212 != 'none'
    uses: ./.github/workflows/gpu-ci-cache-key.yml
    with:
      scala: '2.12'
      integration: ${{ needs.select.outputs.cache212 == 'integration' }}
      base-branch: ${{ needs.select.outputs.base-branch }}
      merge-sha: ${{ needs.select.outputs.merge-sha }}

  cache-213:
    needs: select
    if: needs.select.outputs.cache213 != '' && needs.select.outputs.cache213 != 'none'
    uses: ./.github/workflows/gpu-ci-cache-key.yml
    with:
      scala: '2.13'
      integration: ${{ needs.select.outputs.cache213 == 'integration' }}
      base-branch: ${{ needs.select.outputs.base-branch }}
      merge-sha: ${{ needs.select.outputs.merge-sha }}

  gpu-test:
    name: GPU tests / ${{ matrix.group }}
    needs: [select, cache-212, cache-213]
    # A failed cache preparation is a cold start, not a failed test.
    if: >-
      !cancelled() && needs.select.result == 'success' && needs.select.outputs.matrix != ''
    strategy:
      fail-fast: true
      max-parallel: 8
      matrix: ${{ fromJSON(needs.select.outputs.matrix || '{"include":[]}') }}
    runs-on: ubuntu-latest
    # Allow up to six 15-minute queue waits in addition to the worker and cleanup.
    timeout-minutes: ${{ matrix.kind == 'integration' && 360 || matrix.shims[1] && 300 || 270 }}
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      # No PR checkout or candidate commands in the write-token job.
      - name: Check the approved revision before dispatch
        id: workload
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ needs.select.outputs.base-branch }}
          BASE_SHA: ${{ needs.select.outputs.base-sha }}
          MERGE_SHA: ${{ needs.select.outputs.merge-sha }}
          PARALLEL_UT: ${{ needs.select.outputs.parallel-ut }}
          REDUCED_IT: ${{ needs.select.outputs.reduced-it }}
          GROUP: ${{ toJSON(matrix) }}
          CACHE_212: ${{ needs.cache-212.outputs.key }}
          CACHE_213: ${{ needs.cache-213.outputs.key }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/${GITHUB_REF_NAME#pull-request/}")
          if ! jq -e '.state == "open" and .head.sha == env.GITHUB_SHA and
            .base.ref == env.BASE and .base.sha == env.BASE_SHA and
            .merge_commit_sha == env.MERGE_SHA' <<< "$pr" >/dev/null; then
            echo "::error::PR head, base or merge revision changed. Approve the current revision again."
            exit 1
          fi
          payload=$(jq -cn 'env.GROUP | fromjson | . + {
            "base-branch": env.BASE, "base-sha": env.BASE_SHA, "merge-sha": env.MERGE_SHA,
            "parallel-ut": (env.PARALLEL_UT == "true"),
            "reduced-it": (env.REDUCED_IT == "true"),
            "cache-key": (if .arch != "amd64" then "" elif .scala == "2.12" then env.CACHE_212 else env.CACHE_213 end)}')
          echo "payload=$payload" >> "$GITHUB_OUTPUT"
      - name: Run the shim group
        uses: NVIDIA/spark-rapids-common/runner-queue-fallback@main
        with:
          workflow: gpu-ci-worker.yml
          workflow-ref: ${{ github.ref_name }}
          source-ref: ${{ github.ref }}
          source-sha: ${{ github.sha }}
          workload: ${{ steps.workload.outputs.payload }}
          runner-type: gpu-${{ matrix.arch }}
          queue-timeout-minutes: '15'
          execution-timeout-minutes: ${{ matrix.kind == 'integration' && '240' || matrix.shims[1] && '180' || '150' }}

  gate:
    # The trusted controller combines this attempt's result with any selected DB cells.
    name: Standalone GPU CI result / ${{ needs.select.outputs.merge-sha }} / ${{ needs.select.outputs.title-policy }}
    if: always() && github.repository == 'NVIDIA/cudf-spark' && !github.event.deleted
    needs: [select, gpu-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: read, actions: read}
    steps:
      - id: native
        uses: NVIDIA/spark-rapids-common/workflow-result-gate@main
        with:
          needs: ${{ toJSON(needs) }}
          required-jobs: ${{ needs.select.outputs.required-jobs }}
      - uses: NVIDIA/spark-rapids-common/checkout@main
        if: &check-receipts steps.native.outcome == 'success' && github.run_attempt > 1 && needs.select.outputs.matrix != ''
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/workflows/gpu-ci/job_receipts.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify each selected GPU group passed
        if: *check-receipts
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX: ${{ needs.select.outputs.matrix }}
          SELECTION_ATTEMPT: ${{ needs.select.outputs.selection-attempt }}
        run: python3 -I .github/workflows/gpu-ci/job_receipts.py
