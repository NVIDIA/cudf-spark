name: GPU CI
on:
  push:
    branches: ['pull-request/[0-9]+']

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: gpu-ci-${{ github.ref }}-${{ github.run_attempt > 1 && github.run_id || 'auto' }}
  cancel-in-progress: true

jobs:
  select:
    if: github.repository == 'NVIDIA/cudf-spark' && !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base-branch: ${{ steps.pr.outputs.base }}
      base-sha: ${{ steps.pr.outputs.base-sha }}
      merge-sha: ${{ steps.pr.outputs.merge-sha }}
      parallel-ut: ${{ steps.pr.outputs.parallel-ut }}
      reduced-it: ${{ steps.pr.outputs.reduced-it }}
      matrix: ${{ steps.groups.outputs.matrix }}
      required-jobs: ${{ steps.groups.outputs.matrix && '["select","gpu-test"]' || '["select"]' }}
    steps:
      - name: Identify the approved PR and merge candidate
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const match = /^refs\/heads\/pull-request\/([1-9]\d*)$/.exec(context.ref);
            if (!match) throw new Error('Expected a copy-pr-bot branch');
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: +match[1]});
            if (pr.state !== 'open' || pr.head.sha !== context.sha) {
              throw new Error('The copied revision no longer matches the open PR');
            }
            const base = pr.base.ref;
            const release = /^release\/(\d{2}\.\d{2})$/.exec(base);
            if (base !== 'main' && !(release && release[1] >= '27.02')) {
              core.notice('This target branch still uses Blossom only');
              return;
            }
            if (/\[skip ci\]/i.test(pr.title)) {
              core.notice('GPU tests skipped by PR title');
              return;
            }
            if (!pr.merge_commit_sha || pr.mergeable === false) {
              throw new Error('No testable PR merge revision; resolve conflicts or retry when GitHub has computed it');
            }
            core.setOutput('base', base);
            core.setOutput('base-sha', pr.base.sha);
            core.setOutput('merge-sha', pr.merge_commit_sha);
            core.setOutput('parallel-ut', !/\[serial[ -]ut\]/i.test(pr.title));
            core.setOutput('reduced-it', /\[reduced-it\]/i.test(pr.title));
      - uses: NVIDIA/spark-rapids-common/checkout@main
        if: steps.pr.outputs.merge-sha != ''
        with:
          ref: ${{ steps.pr.outputs.merge-sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Check both merge parents
        if: steps.pr.outputs.merge-sha != ''
        env:
          BASE_SHA: ${{ steps.pr.outputs.base-sha }}
        run: test "$(git show -s --format=%P HEAD)" = "$BASE_SHA $GITHUB_SHA"
      - id: suites
        if: steps.pr.outputs.merge-sha != ''
        continue-on-error: true
        uses: NVIDIA/spark-rapids-common/workflow-suite-selector@main
        with:
          catalog-path: .github/gpu-ci-suites.json
          base-branch: ${{ steps.pr.outputs.base }}
          selector-job: select
      - name: Select GPU runner assignments
        id: groups
        if: steps.pr.outputs.merge-sha != ''
        env:
          SELECT_OUTCOME: ${{ steps.suites.outcome }}
          SUITES: ${{ steps.suites.outputs.suites }}
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.pr.outputs.base }}
          BASE_SHA: ${{ steps.pr.outputs.base-sha }}
          MERGE_SHA: ${{ steps.pr.outputs.merge-sha }}
        run: |
          if [[ $SELECT_OUTCOME != success || -z $SUITES ]]; then
            echo "::warning::Could not establish changed-file scope; running all configured GPU suites"
            SUITES=$(jq -ce '[.suites | to_entries[] | select(.value.enabled != false) | .key] | select(length > 0)' .github/gpu-ci-suites.json)
          fi
          if [[ $SUITES == '[]' ]]; then
            # A docs-only result must belong to the original merge, even if the base moved.
            gh api "repos/$GITHUB_REPOSITORY/pulls/${GITHUB_REF_NAME#pull-request/}" |
              jq -e '.state == "open" and .head.sha == env.GITHUB_SHA and .base.ref == env.BASE and
                .base.sha == env.BASE_SHA and .merge_commit_sha == env.MERGE_SHA' >/dev/null ||
              { echo "::error::Cannot confirm the current PR merge for the no-test decision"; exit 1; }
            exit 0
          fi
          matrix=$(python3 .github/workflows/gpu-ci/groups.py "$SUITES")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  cache-212:
    needs: select
    if: needs.select.outputs.matrix != ''
    uses: ./.github/workflows/gpu-ci-cache-key.yml
    with:
      scala: '2.12'
      base-branch: ${{ needs.select.outputs.base-branch }}
      merge-sha: ${{ needs.select.outputs.merge-sha }}

  cache-213:
    needs: select
    if: needs.select.outputs.matrix != ''
    uses: ./.github/workflows/gpu-ci-cache-key.yml
    with:
      scala: '2.13'
      base-branch: ${{ needs.select.outputs.base-branch }}
      merge-sha: ${{ needs.select.outputs.merge-sha }}

  gpu-test:
    name: GPU tests / ${{ matrix.group }}
    needs: [select, cache-212, cache-213]
    # A failed cache preparation is a cold start, not a failed test.
    if: >-
      !cancelled() && needs.select.result == 'success' && needs.select.outputs.matrix != ''
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.select.outputs.matrix || '{"include":[]}') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      # No PR checkout or candidate commands in the write-token job.
      - name: Check the approved revision before dispatch
        id: workload
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ needs.select.outputs.base-branch }}
          BASE_SHA: ${{ needs.select.outputs.base-sha }}
          MERGE_SHA: ${{ needs.select.outputs.merge-sha }}
          PARALLEL_UT: ${{ needs.select.outputs.parallel-ut }}
          REDUCED_IT: ${{ needs.select.outputs.reduced-it }}
          GROUP: ${{ toJSON(matrix) }}
          CACHE_212: ${{ needs.cache-212.outputs.key }}
          CACHE_213: ${{ needs.cache-213.outputs.key }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/${GITHUB_REF_NAME#pull-request/}")
          if ! jq -e '.state == "open" and .head.sha == env.GITHUB_SHA and
            .base.ref == env.BASE and .base.sha == env.BASE_SHA and
            .merge_commit_sha == env.MERGE_SHA' <<< "$pr" >/dev/null; then
            echo "::error::PR head, base or merge revision changed. Approve the current revision again."
            exit 1
          fi
          payload=$(jq -cn 'env.GROUP | fromjson | . + {
            "base-branch": env.BASE, "base-sha": env.BASE_SHA, "merge-sha": env.MERGE_SHA,
            "parallel-ut": (env.PARALLEL_UT == "true"),
            "reduced-it": (env.REDUCED_IT == "true"),
            "cache-key": (if .scala == "2.12" then env.CACHE_212 else env.CACHE_213 end)}')
          echo "payload=$payload" >> "$GITHUB_OUTPUT"
      - name: Run the shim group
        uses: NVIDIA/spark-rapids-common/runner-queue-fallback@main
        with:
          workflow: gpu-ci-worker.yml
          workflow-ref: ${{ github.ref_name }}
          source-ref: ${{ github.ref }}
          source-sha: ${{ github.sha }}
          workload: ${{ steps.workload.outputs.payload }}
          runner-type: gpu-amd64
          queue-timeout-minutes: '15'
          execution-timeout-minutes: '240'

  gate:
    name: GPU CI gate
    if: always() && github.repository == 'NVIDIA/cudf-spark' && !github.event.deleted
    needs: [select, gpu-test]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: NVIDIA/spark-rapids-common/workflow-result-gate@main
        with:
          needs: ${{ toJSON(needs) }}
          required-jobs: ${{ needs.select.outputs.required-jobs }}
