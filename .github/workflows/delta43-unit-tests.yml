name: Delta 4.3 unit tests
on:
  pull_request:
    paths:
      - 'delta-lake/**'
      - 'tests/**'
      - 'pom.xml'
      - 'scala2.13/**/pom.xml'
      - '.github/workflows/delta43-unit-tests.yml'

concurrency:
  group: delta43-unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  delta43-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: NVIDIA/spark-rapids-common/checkout@main
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build Spark 4.1.1 test dependencies with Delta 4.3
        run: >-
          mvn -B -f scala2.13/pom.xml -pl tests -am
          -Dbuildver=411 -Pdelta43-tests -DskipTests install
      - name: Run Delta 4.3 factory and materialization lifecycle tests
        run: >-
          mvn -B -f scala2.13/pom.xml -pl tests
          -Dbuildver=411 -Pdelta43-tests
          -Dsuites=org.apache.spark.sql.delta.rapids.DeltaRuntimeShimSuite test
