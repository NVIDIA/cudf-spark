# A workflow to run mvn verify check
name: mvn[compile,RAT,scalastyle,docgen]

on:
  workflow_call:
    inputs:
      merge-sha:
        description: PR revision to verify
        required: true
        type: string
      base-branch:
        description: PR target used for Maven cache identity
        required: true
        type: string
    outputs:
      contexts:
        description: Required-check aliases backed by successful Maven matrix jobs
        value: ${{ jobs.result.outputs.contexts }}

concurrency:
  group: maven-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

env:
  COMMON_MVN_FLAGS: >-
    -Ddist.jar.compress=false
    -DskipTests
    -Dmaven.artifact.threads=10
    --batch-mode
    --update-snapshots
    -Dmaven.wagon.http.retryHandler.count=3
    -Dmaven.wagon.httpconnectionManager.ttlSeconds=30
    -Daether.connector.http.connectionMaxTtl=30
    -DsecondaryCacheDir=${MAVEN_REPOSITORY:-$HOME/.m2/repository}/.sbt/1.0/zinc/org.scala-sbt

permissions:
  contents: read

jobs:
  shim-source-graph-tests:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - &checkout-merge
        uses: NVIDIA/spark-rapids-common/checkout@main
        with:
          ref: ${{ inputs.merge-sha }}
          persist-credentials: false
      - name: Validate shim source inheritance
        run: python3 -m unittest discover -s build/tests -p 'test_*.py' -v

  cache-dependencies:
    # A cold Verify seed can spend 30 minutes warming, plus metadata, restore and upload.
    timeout-minutes: &cache-timeout 75
    runs-on: ubuntu-latest
    outputs:
      dailyCacheKey: ${{ steps.maven-cache.outputs.key }}
      defaultSparkVersion: ${{ steps.all212ShimVersionsStep.outputs.defaultSparkVersion }}
      sparkTailVersions: ${{ steps.all212ShimVersionsStep.outputs.tailVersions }}
      sparkJDKVersions: ${{ steps.all212ShimVersionsStep.outputs.jdkVersions }}
    steps:
      - *checkout-merge
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Configure Maven Central mirror
        run: install -Dm 600 .github/actions/maven-cache/settings.xml "$HOME/.m2/settings.xml"
      - name: Prepare Maven dependency cache
        id: maven-cache
        uses: ./.github/actions/maven-cache
        continue-on-error: true
        with:
          scala: '2.12'
          base-branch: ${{ inputs.base-branch }}
          key-only: 'true'
      - &cold-after-prepare
        name: Ignore failed Maven cache preparation
        if: ${{ !cancelled() && steps.maven-cache.outcome == 'failure' }}
        run: bash .github/actions/maven-cache/recover-restore.sh verify
      - name: all shim versions
        id: all212ShimVersionsStep
        run: |
          set -x
          . jenkins/version-def.sh
          svArrBodyNoSnapshot=$(printf ",{\"spark-version\":\"%s\",\"isSnapshot\":false}" "${SPARK_SHIM_VERSIONS_NOSNAPSHOTS_TAIL[@]}")
          svArrBodyNoSnapshot=${svArrBodyNoSnapshot:1}

          # get private artifact version
          privateVer=$(mvn help:evaluate -q -pl dist -Dexpression=cudf-spark-private.version -DforceStdout)
          # do not add empty snapshot versions or when private version is released one (does not include snapshot shims)
          if [[ ${#SPARK_SHIM_VERSIONS_SNAPSHOTS_ONLY[@]} -gt 0 && $privateVer == *"-SNAPSHOT" ]]; then
            svArrBodySnapshot=$(printf ",{\"spark-version\":\"%s\",\"isSnapshot\":true}" "${SPARK_SHIM_VERSIONS_SNAPSHOTS_ONLY[@]}")
            svArrBodySnapshot=${svArrBodySnapshot:1}
            svJsonStr=$(printf {\"include\":[%s]} $svArrBodyNoSnapshot,$svArrBodySnapshot)
          else
            svJsonStr=$(printf {\"include\":[%s]} $svArrBodyNoSnapshot)
          fi

          echo "tailVersions=$svJsonStr" >> $GITHUB_OUTPUT
          # default version
          echo "defaultSparkVersion=${SPARK_BASE_SHIM_VERSION}" >> $GITHUB_OUTPUT
          # jdk17
          jdk17VersionArrBody=$(printf ",{\"spark-version\":\"%s\",\"java-version\":17}" "${SPARK_SHIM_VERSIONS_JDK17[@]}")
          # jdk
          jdkVersionArrBody=$jdk17VersionArrBody
          jdkVersionArrBody=${jdkVersionArrBody:1}
          jdkVersionJsonStr=$(printf {\"include\":[%s]} $jdkVersionArrBody)
          echo "jdkVersions=$jdkVersionJsonStr" >> $GITHUB_OUTPUT


  package-tests:
    # Package jobs reached 28 min; preserve room for the initial build and three retries.
    timeout-minutes: &package-timeout 120
    needs: cache-dependencies
    continue-on-error: ${{ matrix.isSnapshot }}
    strategy:
      matrix: ${{ fromJSON(needs.cache-dependencies.outputs.sparkTailVersions) }}
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - *checkout-merge

      - name: Setup Java and Maven Env
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Configure Maven Central mirror
        run: install -Dm 600 .github/actions/maven-cache/settings.xml "$HOME/.m2/settings.xml"

      - name: Restore Maven dependencies
        id: restore-maven
        if: needs.cache-dependencies.outputs.dailyCacheKey != ''
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ needs.cache-dependencies.outputs.dailyCacheKey }}
      - &cold-maven
        name: Ignore incomplete Maven restore
        if: >-
          !cancelled() && steps.restore-maven.outcome != 'skipped' &&
          (steps.restore-maven.outcome != 'success' || steps.restore-maven.outputs.cache-hit != 'true')
        run: bash .github/actions/maven-cache/recover-restore.sh verify

      - name: check runtime before tests
        run: |
          env | grep JAVA
          java -version && mvn --version && echo "ENV JAVA_HOME: $JAVA_HOME, PATH: $PATH"

      - name: package tests check
        run: |
          # https://github.com/NVIDIA/spark-rapids/issues/8847
          # specify expected versions
          export JAVA_HOME=${JAVA_HOME_17_X64}
          export PATH=${JAVA_HOME}/bin:${PATH}
          java -version && mvn --version && echo "ENV JAVA_HOME: $JAVA_HOME, PATH: $PATH"
          # test command, will retry for 3 times if failed.
          max_retry=3; delay=30; i=1
          while true; do
            mvn package \
              -pl integration_tests,tests,tools -am -P 'individual,pre-merge' \
              -Dbuildver=${{ matrix.spark-version }} -Dmaven.scalastyle.skip=true \
              -Drat.skip=true ${{ env.COMMON_MVN_FLAGS }} && break || {
            if [[ $i -le $max_retry ]]; then
              echo "mvn command failed. Retry $i/$max_retry."; ((i++)); sleep $delay; ((delay=delay*2))
            else
              echo "mvn command failed. Exit 1"; exit 1
            fi
          }
          done

  cache-dependencies-scala213:
    timeout-minutes: *cache-timeout
    runs-on: ubuntu-latest
    outputs:
      scala213dailyCacheKey: ${{ steps.maven-cache.outputs.key }}
      scala213Versions: ${{ steps.all213ShimVersionsStep.outputs.scala213Versions }}
      sparkJDK17Versions: ${{ steps.all213ShimVersionsStep.outputs.jdkVersions }}
    steps:
      - *checkout-merge
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Configure Maven Central mirror
        run: install -Dm 600 .github/actions/maven-cache/settings.xml "$HOME/.m2/settings.xml"
      - name: Prepare Maven dependency cache
        id: maven-cache
        uses: ./.github/actions/maven-cache
        continue-on-error: true
        with:
          scala: '2.13'
          base-branch: ${{ inputs.base-branch }}
          key-only: 'true'
      - *cold-after-prepare
      - name: all 213 shim verions
        id: all213ShimVersionsStep
        run: |
          set -x
          SCALA_BINARY_VER=2.13
          . jenkins/version-def.sh
          svArrBodyNoSnapshot=$(printf ",{\"spark-version\":\"%s\",\"isSnapshot\":false}" "${SPARK_SHIM_VERSIONS_NOSNAPSHOTS[@]}")
          svArrBodyNoSnapshot=${svArrBodyNoSnapshot:1}
          # get private artifact version
          privateVer=$(mvn help:evaluate -q -pl dist -Dexpression=cudf-spark-private.version -DforceStdout)
          svJsonStr=$(printf {\"include\":[%s]} $svArrBodyNoSnapshot)

          echo "scala213Versions=$svJsonStr" >> $GITHUB_OUTPUT

          # jdk17
          jdk17VersionArrBody=$(printf ",{\"spark-version\":\"%s\",\"java-version\":17}" "${SPARK_SHIM_VERSIONS_JDK17_SCALA213[@]}")

          jdkVersionArrBody=$jdk17VersionArrBody
          jdkVersionArrBody=${jdkVersionArrBody:1}
          jdkVersionJsonStr=$(printf {\"include\":[%s]} $jdkVersionArrBody)
          echo "jdkVersions=$jdkVersionJsonStr" >> $GITHUB_OUTPUT


  package-tests-scala213:
    timeout-minutes: *package-timeout
    needs: cache-dependencies-scala213
    continue-on-error: ${{ matrix.isSnapshot }}
    strategy:
      matrix: ${{ fromJSON(needs.cache-dependencies-scala213.outputs.scala213Versions) }}
      fail-fast: false
    runs-on: ubuntu-latest
    steps:

      - *checkout-merge

      - name: Setup Java and Maven Env
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Configure Maven Central mirror
        run: install -Dm 600 .github/actions/maven-cache/settings.xml "$HOME/.m2/settings.xml"

      - name: Restore Maven dependencies
        id: restore-maven
        if: needs.cache-dependencies-scala213.outputs.scala213dailyCacheKey != ''
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ needs.cache-dependencies-scala213.outputs.scala213dailyCacheKey }}
      - *cold-maven

      - name: check runtime before tests
        run: |
          env | grep JAVA
          java -version && mvn --version && echo "ENV JAVA_HOME: $JAVA_HOME, PATH: $PATH"

      - name: package tests check
        run: |
          # https://github.com/NVIDIA/spark-rapids/issues/8847
          # specify expected versions
          export JAVA_HOME=${JAVA_HOME_17_X64}
          export PATH=${JAVA_HOME}/bin:${PATH}
          java -version && mvn --version && echo "ENV JAVA_HOME: $JAVA_HOME, PATH: $PATH"
          # verify Scala 2.13 build files
          ./build/make-scala-version-build-files.sh 2.13
          # verify git status
          if [ -n "$(echo -n $(git status -s | grep 'scala2.13'))" ]; then
              git add -N scala2.13/* && git diff 'scala2.13/*'
              echo "Generated Scala 2.13 build files don't match what's in repository"
              exit 1
          fi
          # test command, will retry for 3 times if failed.
          max_retry=3; delay=30; i=1
          while true; do
            mvn package -f scala2.13/ \
              -pl integration_tests,tests,tools -am -P 'individual,pre-merge' \
              -Dbuildver=${{ matrix.spark-version }} -Dmaven.scalastyle.skip=true \
              -Drat.skip=true ${{ env.COMMON_MVN_FLAGS }} && break || {
            if [[ $i -le $max_retry ]]; then
              echo "mvn command failed. Retry $i/$max_retry."; ((i++)); sleep $delay; ((delay=delay*2))
            else
              echo "mvn command failed. Exit 1"; exit 1
            fi
          }
          done

  verify-213-modules:
    # Verify/install jobs reached 16 min before accounting for retry and cold restore time.
    timeout-minutes: &verify-timeout 90
    needs: cache-dependencies-scala213
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.cache-dependencies-scala213.outputs.sparkJDK17Versions) }}
    steps:
      - *checkout-merge

      - name: Setup Java and Maven Env
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Configure Maven Central mirror
        run: install -Dm 600 .github/actions/maven-cache/settings.xml "$HOME/.m2/settings.xml"

      - name: Restore Maven dependencies
        id: restore-maven
        if: needs.cache-dependencies-scala213.outputs.scala213dailyCacheKey != ''
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ needs.cache-dependencies-scala213.outputs.scala213dailyCacheKey }}
      - *cold-maven

      - name: check runtime before tests
        run: |
          env | grep JAVA
          java -version && mvn --version && echo "ENV JAVA_HOME: $JAVA_HOME, PATH: $PATH"

      - name: Build JDK
        run: |
          # https://github.com/NVIDIA/spark-rapids/issues/8847
          # specify expected versions
          export JAVA_HOME=${JAVA_HOME_${{ matrix.java-version }}_X64}
          export PATH=${JAVA_HOME}/bin:${PATH}
          java -version && mvn --version && echo "ENV JAVA_HOME: $JAVA_HOME, PATH: $PATH"
           # verify Scala 2.13 build files
          ./build/make-scala-version-build-files.sh 2.13
          # verify git status
          if [ -n "$(echo -n $(git status -s | grep 'scala2.13'))" ]; then
              git add -N scala2.13/* && git diff 'scala2.13/*'
              echo "Generated Scala 2.13 build files don't match what's in repository"
              exit 1
          fi
          # test command, will retry for 3 times if failed.
          max_retry=3; delay=30; i=1
          while true; do
            mvn verify -f scala2.13/ \
              -P "individual,pre-merge,source-javadoc" -Dbuildver=${{ matrix.spark-version }} \
              ${{ env.COMMON_MVN_FLAGS }} && break || {
            if [[ $i -le $max_retry ]]; then
              echo "mvn command failed. Retry $i/$max_retry."; ((i++)); sleep $delay; ((delay=delay*2))
            else
              echo "mvn command failed. Exit 1"; exit 1
            fi
          }
          done

  verify-all-212-modules:
    timeout-minutes: *verify-timeout
    needs: cache-dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.cache-dependencies.outputs.sparkJDKVersions) }}
    steps:
      - *checkout-merge

      - name: Setup Java and Maven Env
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - name: Configure Maven Central mirror
        run: install -Dm 600 .github/actions/maven-cache/settings.xml "$HOME/.m2/settings.xml"

      - name: Restore Maven dependencies
        id: restore-maven
        if: needs.cache-dependencies.outputs.dailyCacheKey != ''
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ needs.cache-dependencies.outputs.dailyCacheKey }}
      - *cold-maven

      - name: check runtime before tests
        run: |
          env | grep JAVA
          java -version && mvn --version && echo "ENV JAVA_HOME: $JAVA_HOME, PATH: $PATH"

      - name: Build JDK
        run: |
          # https://github.com/NVIDIA/spark-rapids/issues/8847
          # specify expected versions
          export JAVA_HOME=${JAVA_HOME_${{ matrix.java-version }}_X64}
          export PATH=${JAVA_HOME}/bin:${PATH}
          java -version && mvn --version && echo "ENV JAVA_HOME: $JAVA_HOME, PATH: $PATH"
          # test command, will retry for 3 times if failed.
          max_retry=3; delay=30; i=1
          while true; do
            mvn verify \
              -P "individual,pre-merge" -Dbuildver=${{ matrix.spark-version }} \
              ${{ env.COMMON_MVN_FLAGS }} && break || {
            if [[ $i -le $max_retry ]]; then
              echo "mvn command failed. Retry $i/$max_retry."; ((i++)); sleep $delay; ((delay=delay*2))
            else
              echo "mvn command failed. Exit 1"; exit 1
            fi
          }
          done

  install-modules:
    timeout-minutes: *verify-timeout
    needs: cache-dependencies
    env:
      # The wrapper downloads Maven before it can read settings.xml.
      MVNW_REPOURL: https://maven-central.storage-download.googleapis.com/maven2
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        maven-version: [3.8.1, 3.8.8, 3.9.3]
    steps:
      - *checkout-merge

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 11
      - name: Configure Maven Central mirror
        run: install -Dm 600 .github/actions/maven-cache/settings.xml "$HOME/.m2/settings.xml"

      - name: Restore Maven dependencies
        id: restore-maven
        if: needs.cache-dependencies.outputs.dailyCacheKey != ''
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ needs.cache-dependencies.outputs.dailyCacheKey }}
      - *cold-maven

      - name: Setup Maven Wrapper
        run: mvn wrapper:wrapper -Dmaven=${{ matrix.maven-version }}

      - name: check runtime before tests
        run: |
          env | grep JAVA
          java -version && mvn --version && echo "ENV JAVA_HOME: $JAVA_HOME, PATH: $PATH"

      - name: Install with Maven ${{ matrix.maven-version }}
        run: |
          # https://github.com/NVIDIA/spark-rapids/issues/8847
          # specify expected versions
          export JAVA_HOME=${JAVA_HOME_17_X64}
          export PATH=${JAVA_HOME}/bin:${PATH}
          java -version && mvn --version && echo "ENV JAVA_HOME: $JAVA_HOME, PATH: $PATH"
          # test command, will retry for 3 times if failed.
          max_retry=3; delay=30; i=1
          while true; do
            ./mvnw install \
              -P "individual,pre-merge" \
              -Dbuildver=${{ needs.cache-dependencies.outputs.defaultSparkVersion }} \
              ${{ env.COMMON_MVN_FLAGS }} && break || {
            if [[ $i -le $max_retry ]]; then
              echo "mvn command failed. Retry $i/$max_retry."; ((i++)); sleep $delay; ((delay=delay*2))
            else
              echo "mvn command failed. Exit 1"; exit 1
            fi
          }
          done

  validate-iceberg-matrix:
    timeout-minutes: 30
    name: Validate Iceberg matrix
    needs: cache-dependencies-scala213
    runs-on: ubuntu-latest
    steps:
      - *checkout-merge
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Configure Maven Central mirror
        run: install -Dm 600 .github/actions/maven-cache/settings.xml "$HOME/.m2/settings.xml"
      - name: Restore Maven dependencies
        id: restore-maven
        if: needs.cache-dependencies-scala213.outputs.scala213dailyCacheKey != ''
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ needs.cache-dependencies-scala213.outputs.scala213dailyCacheKey }}
      - *cold-maven
      - name: Check JSON against canonical Scala 2.13 packaging
        run: python3 -B scripts/get_iceberg_versions.py validate

  with-resource-nesting-audit:
    timeout-minutes: 20
    name: withResource nesting audit
    runs-on: ubuntu-latest
    steps:
      - *checkout-merge

      - name: Configure Maven Central mirror
        run: install -Dm 600 .github/actions/maven-cache/settings.xml "$HOME/.m2/settings.xml"

      - name: Report withResource nesting violations
        run: |
          audit_status=0
          mvn --batch-mode -N antrun:run@with-resource-nesting-audit \
            -DwithResource.audit.rawReport="$RUNNER_TEMP/with-resource-nesting-audit.json" \
            -DwithResource.audit.summary="$GITHUB_STEP_SUMMARY" \
            -DwithResource.audit.annotations="$RUNNER_TEMP/with-resource-nesting-annotations.txt" || audit_status=$?
          if [[ -f "$RUNNER_TEMP/with-resource-nesting-annotations.txt" ]]; then
            cat "$RUNNER_TEMP/with-resource-nesting-annotations.txt"
          fi
          exit "$audit_status"

      - name: Upload withResource nesting report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: with-resource-nesting-audit
          overwrite: true
          path: ${{ runner.temp }}/with-resource-nesting-audit.json
          if-no-files-found: ignore

  result:
    timeout-minutes: 5
    name: Maven Verify result
    if: always()
    needs: [shim-source-graph-tests, cache-dependencies, package-tests, cache-dependencies-scala213, package-tests-scala213, verify-213-modules, verify-all-212-modules, install-modules, validate-iceberg-matrix, with-resource-nesting-audit]
    runs-on: ubuntu-slim
    outputs:
      contexts: ${{ steps.verified.outputs.contexts }}
    steps:
      - uses: NVIDIA/spark-rapids-common/workflow-result-gate@main
        with:
          needs: ${{ toJSON(needs) }}
          required-jobs: '["shim-source-graph-tests","cache-dependencies","package-tests","cache-dependencies-scala213","package-tests-scala213","verify-213-modules","verify-all-212-modules","install-modules","validate-iceberg-matrix","with-resource-nesting-audit"]'
      - uses: NVIDIA/spark-rapids-common/checkout@main
        with:
          ref: ${{ inputs.merge-sha }}
          sparse-checkout: .github/workflows/cpu-ci.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Report verified matrix contexts for existing branch rules
        id: verified
        shell: bash
        env:
          PACKAGES_212: ${{ needs.cache-dependencies.outputs.sparkTailVersions }}
          PACKAGES_213: ${{ needs.cache-dependencies-scala213.outputs.scala213Versions }}
          VERIFY_213: ${{ needs.cache-dependencies-scala213.outputs.sparkJDK17Versions }}
        run: bash .github/workflows/cpu-ci.sh maven-contexts
