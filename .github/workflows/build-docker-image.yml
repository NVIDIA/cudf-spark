# Build and smoke-test one image for each requested platform, then publish it when requested.
name: Build Docker image

on:
  workflow_call:
    inputs:
      config:
        required: true
        type: string
      merge-sha:
        description: Exact merge commit for premerge validation only
        type: string
      publish:
        type: boolean
        default: false

jobs:
  build:
    name: ${{ matrix.worker.arch }}
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(inputs.config).workers }}
    runs-on: ${{ matrix.worker.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    # PR validation peaked near 16 minutes on Rocky amd64; allow for a cold native build.
    timeout-minutes: ${{ inputs.publish && 90 || 45 }}
    steps:
      - uses: NVIDIA/spark-rapids-common/checkout@main
        with:
          ref: ${{ !inputs.publish && inputs.merge-sha || '' }}
          persist-credentials: false
      - uses: NVIDIA/spark-rapids-common/checkout@main
        with:
          repository: NVIDIA/spark-rapids-common
          ref: main
          path: .image-common
          sparse-checkout: container-image
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Compute recipe version including copied files
        id: recipe
        env:
          CONFIG: ${{ inputs.config }}
          WORKER: ${{ toJSON(matrix.worker) }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          config=$(jq -c --argjson w "$WORKER" 'del(.workers) + $w' <<< "$CONFIG")
          # A native build must not move a consumer tag before the final recipe check.
          if [[ "$PUBLISH" == true ]]; then
            tag="build-$(jq -r .tag <<< "$config")-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$(jq -r .arch <<< "$WORKER")"
            config=$(jq -c --arg tag "$tag" '.tag = $tag' <<< "$config")
          fi
          metadata=$(python3 .image-common/container-image/metadata.py <<< "$config")
          echo "config=$(jq -c --argjson meta "$metadata" '. + $meta' <<< "$config")" >> "$GITHUB_OUTPUT"
      - name: Check this recipe still owns the branch tag
        id: guard
        if: inputs.publish
        env:
          IMAGE: ${{ fromJSON(inputs.config).image }}
        run: python3 .github/workflows/ci-images/select.py --current "$IMAGE"
      # Never refresh this baseline on a retry. Either original worker can supply it.
      - name: Record destination tags before building
        id: baseline
        if: inputs.publish && fromJSON(inputs.config).multi && steps.guard.outputs.current == 'true' && github.run_attempt == 1
        continue-on-error: true
        env:
          PACKAGE: ${{ fromJSON(inputs.config).image }}
          TAG: ${{ fromJSON(inputs.config).tag }}
          RELEASE_TAG: ${{ fromJSON(inputs.config).release_tag }}
          ARCH: ${{ matrix.worker.arch }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/$PACKAGE"
          previous=$(python3 -I .github/workflows/ci-images/tag-baseline.py record "$image" "$TAG" ${RELEASE_TAG:+"$RELEASE_TAG"})
          jq -n --arg image "$image" --arg source "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" --arg platform "linux/$ARCH" --argjson previous "$previous" \
            '{$image, $source, $run, $attempt, $platform, $previous}' > "$RUNNER_TEMP/baseline-$ARCH.json"
      - name: Save original tag baseline
        if: steps.baseline.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: baseline-${{ fromJSON(inputs.config).id }}-${{ matrix.worker.arch }}
          path: ${{ runner.temp }}/baseline-${{ matrix.worker.arch }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Build and smoke-test
        id: image
        if: ${{ !inputs.publish || steps.guard.outputs.current == 'true' }}
        uses: ./.image-common/container-image
        with:
          config: ${{ steps.recipe.outputs.config }}
          publish: ${{ inputs.publish && 'true' || 'false' }}
          token: ${{ inputs.publish && github.token || '' }}
      # The shared builder removes its temporary registry credentials after promotion.
      - uses: docker/login-action@v4.7.0
        if: inputs.publish && !fromJSON(inputs.config).multi && steps.guard.outputs.current == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the verified single-platform image
        id: single
        if: inputs.publish && !fromJSON(inputs.config).multi && steps.guard.outputs.current == 'true'
        env:
          IMAGE: ${{ fromJSON(inputs.config).image }}
          TAG: ${{ fromJSON(inputs.config).tag }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: bash .github/workflows/ci-images/publish-tag.sh "$IMAGE" "$TAG" "$TAG" "$DIGEST"
      - name: Seed the release tag from the verified single-platform image
        if: steps.single.outputs.digest != '' && fromJSON(inputs.config).release_tag != ''
        env:
          IMAGE: ${{ fromJSON(inputs.config).image }}
          TAG: ${{ fromJSON(inputs.config).tag }}
          RELEASE_TAG: ${{ fromJSON(inputs.config).release_tag }}
          DIGEST: ${{ steps.single.outputs.digest }}
        run: bash .github/workflows/ci-images/publish-tag.sh "$IMAGE" "$TAG" "$RELEASE_TAG" "$DIGEST"
      - name: Record verified platform digest
        if: inputs.publish && fromJSON(inputs.config).multi && steps.guard.outputs.current == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
          TAG: ${{ fromJSON(inputs.config).tag }}
          ARCH: ${{ matrix.worker.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/platforms"
          jq -n --arg image "$IMAGE" --arg digest "$DIGEST" --arg tag "$TAG" \
            --arg platform "linux/$ARCH" --arg source "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            '{$image, $digest, $tag, $platform, $source, $run}' > "$RUNNER_TEMP/platforms/$ARCH.json"
      - uses: actions/upload-artifact@v7.0.2
        if: inputs.publish && fromJSON(inputs.config).multi && steps.guard.outputs.current == 'true'
        with:
          name: digest-${{ fromJSON(inputs.config).id }}-${{ matrix.worker.arch }}
          path: ${{ runner.temp }}/platforms/*.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  promote:
    name: Publish verified platform pair
    if: inputs.publish && fromJSON(inputs.config).multi
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: ${{ fromJSON(inputs.config).image }}
      TAG: ${{ fromJSON(inputs.config).tag }}
      RELEASE_TAG: ${{ fromJSON(inputs.config).release_tag }}
    steps:
      - uses: NVIDIA/spark-rapids-common/checkout@main
        with:
          persist-credentials: false
      - name: Check recipe before promoting the tag
        id: guard
        run: python3 .github/workflows/ci-images/select.py --current "$IMAGE"
      - uses: actions/download-artifact@v8.0.2
        if: steps.guard.outputs.current == 'true'
        with:
          # Include a successful sibling from a previous attempt of this same run.
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          pattern: digest-${{ fromJSON(inputs.config).id }}-*
          path: ${{ runner.temp }}/platforms
          merge-multiple: true
      - name: Restore original tag baseline for retry
        if: steps.guard.outputs.current == 'true' && github.run_attempt > 1
        uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          pattern: baseline-${{ fromJSON(inputs.config).id }}-*
          path: ${{ runner.temp }}/baselines
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4.4.1
        if: steps.guard.outputs.current == 'true'
      - uses: docker/login-action@v4.7.0
        if: steps.guard.outputs.current == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Promote the verified digests
        id: publish
        if: steps.guard.outputs.current == 'true'
        env:
          PLATFORM_RECORDS: ${{ runner.temp }}/baselines
        run: bash .github/workflows/ci-images/promote-platforms.sh "$IMAGE" "$TAG" "$RUNNER_TEMP/platforms"
      - name: Seed the release tag from the verified platform index
        if: steps.publish.outputs.digest != '' && env.RELEASE_TAG != ''
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          PLATFORM_RECORDS: ${{ runner.temp }}/baselines
        run: bash .github/workflows/ci-images/publish-tag.sh "$IMAGE" "$TAG" "$RELEASE_TAG" "$DIGEST"
