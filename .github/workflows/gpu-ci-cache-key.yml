name: GPU CI Maven cache key
on:
  workflow_call:
    inputs:
      scala: {type: string, required: true}
      integration: {type: boolean, default: false}
      base-branch: {type: string, required: true}
      merge-sha: {type: string, required: true}
    outputs:
      key:
        value: ${{ jobs.prepare.outputs.key }}

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.integration && 90 || 60 }}
    outputs:
      key: ${{ steps.maven.outcome == 'success' && steps.maven.outputs.key || '' }}
    steps:
      - uses: NVIDIA/spark-rapids-common/checkout@main
        with:
          ref: ${{ inputs.merge-sha }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: install -Dm 600 .github/actions/maven-cache/settings.xml "$HOME/.m2/settings.xml"
      - id: maven
        continue-on-error: true
        uses: ./.github/actions/maven-cache
        with:
          scala: ${{ inputs.scala }}
          base-branch: ${{ inputs.base-branch }}
          key-only: 'true'
          premerge: ${{ inputs.integration && 'true' || 'false' }}
