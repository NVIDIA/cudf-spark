[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "cudf-spark-roi"
version = "0.1.0"
description = "Offline, auditable CPU/GPU cost and investment comparisons for Spark workloads"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0 AND CC-BY-4.0"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.scripts]
spark-roi = "spark_roi.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
